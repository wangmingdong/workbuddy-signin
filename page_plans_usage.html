  <!-- 品牌主题首帧落地：在解析 HTML 时（早于 JS bundle）同步判定品牌，

  <script>
    (function () {
      try {
        var STORAGE_KEY = 'cb_brand_override';
        var VALID = { codebuddy: 1, workbuddy: 1 };
        var host = window.location.hostname;
        var overrideAllowed =
          host === 'localhost' ||
          host.indexOf('127.') === 0 ||
          host.indexOf('192.168.') === 0 ||
          host.indexOf('staging') !== -1 ||
          host.indexOf('test') !== -1;

        var brand = null;

          var q = new URLSearchParams(window.location.search).get('brand');
          if (q && VALID[q]) {

            try { window.localStorage.setItem(STORAGE_KEY, q); } catch (e) {}
          }
          if (!brand) {
            try {
              var s = window.localStorage.getItem(STORAGE_KEY);
              if (s && VALID[s]) brand = s;
            } catch (e) {}
          }
        }
        if (!brand) brand = host.indexOf('.workbuddy.') !== -1 ? 'workbuddy' : 'codebuddy';

        document.documentElement.dataset.brand = brand;

        // iframe 三方回跳中转页（/profile/iframe-callback）跳过品牌底色 + 打 data-callback：
        //   - 该路由是 iframe 里加载的过渡页，视觉需求是纯净的 #ededed 灰底（组件内联）+
        //     spinner，不能带主题底色（否则 iframe 里会闪深色/浅色主题底）。
        //   - <html> 上的行内 style 优先级最高，任何 CSS 都盖不住，所以只能在源头这里判定
        //     并跳过设置。同时把 data-callback 打上，让 app.less 里 :root[data-callback]
        //   规则把 body / #root 的 --cb-surface-page 也一并透明化。
        // - 用 endsWith 而非等值：BrowserRouter basename='/profile'，实际路径是
    //     /profile/iframe-callback；endsWith 也扛得住未来 basename 调整。
        //   - main.tsx 顶部还会再幂等打一次 data-callback，双保险（bundle 顺序万一被 CDN
     //     缓存或 HTML 修改打乱时兜底）。
        if (window.location.pathname.indexOf('/iframe-callback') !== -1) {
          document.documentElement.setAttribute('data-callback', '');
          document.documentElement.style.backgroundColor = 'transparent';
        } else {
          // 与 brand-tokens.less 的 --cb-surface-page 保持一致
          document.documentElement.style.backgroundColor = brand === 'workbuddy' ? '#f5f7fa' : '#18161a';
        }
      } catch (e) {
        /* 判定失败时留给 JS bundle 的 applyBrandToRoot() 兜底 */
  }
    })();
  </script>
