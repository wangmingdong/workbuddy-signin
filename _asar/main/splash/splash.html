<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkBuddy</title>
    <style>
        :root {
            /* 保持与 renderer MigrationProgressView 视觉一致 */
            --cb-border: #e5e7eb;
            --cb-text-muted: #6b7280;
            --cb-text-title: #111827;
            --cb-text-subtitle: #4b5563;
            --cb-accent: #1DC78A;
            --cb-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --cb-border: #2a2a2a;
                --cb-text-muted: #8a8a8a;
                --cb-text-title: #e6e6e6;
                --cb-text-subtitle: #b0b0b0;
                --cb-bg: #1e1e1e;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--cb-bg);
            color: var(--cb-text-title);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
                Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-app-region: drag;
        }

        .splash-root {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 720px;
            padding: 32px;
        }

        .splash-logo {
            width: 140px;
            height: auto;
            display: block;
            pointer-events: none;
        }

        .splash-title {
            font-size: 32px;
            font-weight: 600;
            color: var(--cb-text-title);
            text-align: center;
            margin-bottom: 8px;
        }

        .splash-subtitle {
            font-size: 16px;
            line-height: 1.6;
            color: var(--cb-text-subtitle);
            text-align: center;
            max-width: 600px;
            white-space: nowrap;
            margin: 0;
        }

        .splash-progress-section {
            width: 100%;
            max-width: 600px;
        }

        .splash-progress-track {
            background: var(--cb-border);
            border-radius: 4px;
            height: 6px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .splash-progress-bar {
            height: 100%;
            background: var(--cb-accent);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* indeterminate 动画：初始化阶段没有真实进度时使用 */
        .splash-progress-bar.indeterminate {
            width: 30% !important;
            animation: splash-slide 1.4s linear infinite;
        }

        @keyframes splash-slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(333%); }
        }

        .splash-progress-caption {
            font-size: 12px;
            color: var(--cb-text-muted);
            text-align: center;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="splash-root">
        <div class="splash-main">
            <img id="splash-logo" class="splash-logo" alt="WorkBuddy" draggable="false" />

            <div>
                <h2 id="splash-title" class="splash-title">Preparing Environment</h2>
                <p id="splash-subtitle" class="splash-subtitle">
                    Preparing the runtime environment. Please wait — the app will open automatically when ready.
                </p>
            </div>

            <div class="splash-progress-section">
                <div class="splash-progress-track">
                    <div id="splash-progress-bar" class="splash-progress-bar indeterminate"></div>
                </div>
                <p id="splash-progress-caption" class="splash-progress-caption">
                    Preparing runtime...
                </p>
            </div>
        </div>
    </div>

    <script>
        /* Splash 窗口渲染脚本
         *
         * 主进程会通过 preload(contextIsolation=false) 注入 window.splashAPI：
         *   splashAPI.onUpdate(fn) — 订阅进度更新，fn({ phase, current?, total?, title?, subtitle?, caption? })
         *   splashAPI.setLogo(dataUrl) — 可选：注入 base64 logo，避免从 asar 读文件
         *
         * 没有注入时（仅调试打开 splash.html），用默认态展示。
         */
        (function () {
            const $ = (id) => document.getElementById(id);

            const els = {
                logo: $('splash-logo'),
                title: $('splash-title'),
                subtitle: $('splash-subtitle'),
                bar: $('splash-progress-bar'),
                caption: $('splash-progress-caption'),
            };

            function applyUpdate(update) {
                if (!update || typeof update !== 'object') { return; }
                if (typeof update.title === 'string') { els.title.textContent = update.title; }
                if (typeof update.subtitle === 'string') { els.subtitle.textContent = update.subtitle; }

                if (update.phase === 'migrating') {
                    const current = Number(update.current) || 0;
                    const total = Number(update.total) || 0;
                    const pct = total > 0 ? Math.min(100, Math.round((current / total) * 100)) : 0;
                    els.bar.classList.remove('indeterminate');
                    els.bar.style.width = pct + '%';
                    if (total > 0 && typeof update.migratingProgress === 'string') {
                        els.caption.textContent = update.migratingProgress
                            .replace('{{current}}', String(current))
                            .replace('{{total}}', String(total));
                    } else {
                        els.caption.textContent = update.migratingFallback || (current + ' / ' + total);
                    }
                } else if (update.phase === 'repairing') {
                    // 修复阶段：indeterminate 进度条 + caption 展示当前步骤
                    els.bar.classList.add('indeterminate');
                    els.bar.style.width = '';
                    if (typeof update.caption === 'string') {
                        els.caption.textContent = update.caption;
                    }
                } else if (update.phase === 'initializing') {
                    els.bar.classList.add('indeterminate');
                    els.bar.style.width = '';
                }
            }

            const api = window.splashAPI;
            if (api && typeof api.onUpdate === 'function') {
                api.onUpdate(applyUpdate);
            }
            // 注册完立刻拉一次当前状态，避免 splash 出现时错过已推送的 update
            if (api && typeof api.getLastUpdate === 'function') {
                Promise.resolve(api.getLastUpdate()).then((update) => {
                    if (update) { applyUpdate(update); }
                }).catch(() => { /* ignore */ });
            }
            if (api && typeof api.getLogoDataUrl === 'function') {
                Promise.resolve(api.getLogoDataUrl()).then((url) => {
                    if (url) { els.logo.src = url; }
                }).catch(() => { /* ignore */ });
            }
        })();
    </script>
</body>
</html>
